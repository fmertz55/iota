{
  "schema_version": 1,
  "definitions": [
    {
      "id": "DEF-IOTA",
      "term": "Iota",
      "symbol": "I_x(t)",
      "kind": "primitive",
      "status": "provisional",
      "definition": "A stationary lattice address together with the local attribute and expression state instantiated at that address.",
      "latex": "I_x(t) = \\left(x,A_x(t),E_x(t)\\right)"
    },
    {
      "id": "DEF-REACHABLE",
      "term": "Reachable set",
      "symbol": "\\mathcal{R}_x(t+1\\mid s_t)",
      "kind": "derived",
      "status": "provisional",
      "definition": "The set of next local states admissible from state s_t under the declared local law.",
      "latex": "\\mathcal{R}_x(t+1\\mid s_t)=\\{(A',E'):(A',E')\\text{ is admissible under }\\mathcal{L}\\}"
    },
    {
      "id": "DEF-INFORMATION",
      "term": "Interaction-induced information",
      "symbol": "\\Delta I_x",
      "kind": "hypothesis",
      "status": "organizing hypothesis",
      "definition": "The change in the reachable caused by interaction. For strict reachable-set reduction, the current cardinality measure is the logarithm of the prior-to-posterior reachable-set size ratio.",
      "latex": "\\Delta I_x=\\log\\frac{|\\mathcal{R}_x^{\\mathrm{prior}}|}{|\\mathcal{R}_x^{\\mathrm{posterior}}|}"
    },
    {
      "id": "DEF-ADJACENT-FRONTIER",
      "term": "Adjacent frontier",
      "symbol": "\\mathcal{J}_{x,t,\\tau}^{\\pi,\\ell}",
      "kind": "working theoretical construct",
      "status": "provisional; unmeasured in the reported experiments",
      "definition": "For a declared state, policy, horizon, resource boundary, scale-specific type map, and previously actualized type repertoire, the types represented among reachable futures that have not yet been actualized. It is a bounded and observer-indexed accessibility construct, not an observer-free or open-ended phase space.",
      "latex": "\\mathcal{J}_{x,t,\\tau}^{\\pi,\\ell}(s_t)=r_\\ell(\\mathcal{R}_{x,\\tau}^{\\pi}(s_t))\\setminus V_t^\\ell"
    },
    {
      "id": "DEF-POSSIBILITY-FLUX-LEDGER",
      "term": "Possibility-flux ledger",
      "symbol": "(K,E,L)",
      "kind": "set diagnostic",
      "status": "formal; unmeasured in the reported experiments",
      "definition": "For prior and post-interaction reachable supports defined on the same outcome space, the ordered decomposition into retained outcomes K, enabled outcomes E, and lost outcomes L. The ledger preserves outcome identity when a scalar net-volume change would hide turnover.",
      "latex": "K=R_0\\cap R_1,\\qquad E=R_1\\setminus R_0,\\qquad L=R_0\\setminus R_1"
    },
    {
      "id": "DEF-SIGNED-SUPPORT-DEFORMATION",
      "term": "Signed support deformation",
      "symbol": "\\chi(R_1\\!:\\!R_0)",
      "kind": "support-volume diagnostic",
      "status": "formal; unmeasured in the reported experiments",
      "definition": "The logarithm of prior reachable-support measure divided by post-interaction reachable-support measure, using one declared base measure on finite nonempty supports. Positive values denote net pruning, negative values denote net enabling, and zero does not exclude complete outcome turnover.",
      "latex": "\\chi(R_1\\!:\\!R_0)=\\log\\frac{\\mu(R_0)}{\\mu(R_1)}"
    },
    {
      "id": "DEF-COHERENCE",
      "term": "Coherence",
      "symbol": "",
      "kind": "observable",
      "status": "operational",
      "definition": "A connected active structure measured using the explicitly declared neighborhood connectivity. It is not assumed to be a fundamental physical object."
    },
    {
      "id": "DEF-BRIDGE",
      "term": "Bridge",
      "symbol": "B",
      "kind": "observable",
      "status": "operational",
      "definition": "A set of active lattice cells whose removal changes reachability between tracked regions in the audited state."
    },
    {
      "id": "DEF-CONSTRAINT-TRANSPORT",
      "term": "Strict constraint transport",
      "symbol": "",
      "kind": "observable",
      "status": "operational",
      "definition": "Loss and restoration of reachability between the same tracked predecessor regions through a causally necessary successor bridge disjoint from the predecessor bridge."
    },
    {
      "id": "DEF-PAYLOAD-FREE",
      "term": "Payload-free",
      "symbol": "P=0",
      "kind": "condition",
      "status": "operational",
      "definition": "World.P is zero at every observed offset in the audited continuation."
    },
    {
      "id": "DEF-LEDGER-EXACT",
      "term": "Ledger exactness",
      "symbol": "",
      "kind": "safety condition",
      "status": "operational",
      "definition": "The experiment's conservation ledger has zero recorded discrepancy at every audited offset."
    },
    {
      "id": "DEF-ADDRESS-LINEAGE",
      "term": "Predecessor address lineage",
      "symbol": "",
      "kind": "observable",
      "status": "operational",
      "definition": "A conservative lineage that remains alive while at least one original stationary iota address of the predecessor region remains active; later reactivation after complete address loss does not restore the terminated lineage."
    },
    {
      "id": "DEF-EXPRESSION-LINEAGE",
      "term": "Prospective expression lineage",
      "symbol": "",
      "kind": "observable",
      "status": "operational",
      "definition": "A non-resurrecting lineage propagated only when a successful transfer from a current lineage address newly activates its target in that tick; retained active addresses remain members, already-active targets do not inherit identity, and ambiguous dual claims invalidate a strict result."
    },
    {
      "id": "DEF-HANDOFF-SUSCEPTIBILITY",
      "term": "Expression-handoff susceptibility",
      "symbol": "p_{\\mathrm{handoff}}",
      "kind": "observable",
      "status": "operational",
      "definition": "Among continuation branches from a fixed state in which the original singleton address becomes inactive within the declared horizon, the fraction retaining a nonempty, collision-free prospective singleton expression lineage immediately after that first deactivation."
    },
    {
      "id": "DEF-CONTINUATION-RULE",
      "term": "Candidate lineage-continuation rule",
      "symbol": "",
      "kind": "hypothesis",
      "status": "operational candidate",
      "definition": "A frozen mapping from features available immediately before original-address deactivation to the presence or absence of a nonempty prospective expression lineage immediately afterward; a predictive marker is not treated as a primitive law unless it is both sufficiently sensitive and independently replicated."
    },
    {
      "id": "DEF-TEMPORAL-GATE",
      "term": "Temporal continuation gate",
      "symbol": "",
      "kind": "causal mechanism",
      "status": "operational",
      "definition": "An ordered event decision whose resolution before source termination changes whether an ancestry-preserving successor is realized; it is identified by a frozen intervention that changes that decision while leaving the pre-intervention state and consumed random draw fixed."
    },
    {
      "id": "DEF-OPPORTUNITY-LIFETIME",
      "term": "Opportunity lifetime",
      "symbol": "\\tau_{\\mathrm{opp}}",
      "kind": "causal observable",
      "status": "operational",
      "definition": "The ordered event or tick interval during which a specified successor transition remains admissible, ending when that transition is realized or a declared lawful event makes the route unavailable."
    },
    {
      "id": "DEF-REALIZATION-REDUNDANCY",
      "term": "Realization redundancy",
      "symbol": "",
      "kind": "causal observable",
      "status": "operational",
      "definition": "For a factual ancestry-producing event selected before intervention, temporal redundancy occurs when vetoing that event leads to another ancestry-preserving child within the declared follow-up. The selected event is branch-necessary when the address instead dies without inherited continuation; continued source activity at the horizon is censored."
    },
    {
      "id": "DEF-SEQUENTIAL-CUT-DEPTH",
      "term": "Sequential realization cut depth",
      "symbol": "D_{\\mathrm{seq}}",
      "kind": "causal observable",
      "status": "operational",
      "definition": "Under a frozen retained-amplitude veto policy and fixed follow-up, the smallest depth d along a branch's prospectively committed selector chain at which vetoing the first d ancestry-producing events causes the original address to deactivate without a live collision-free descendant. Handoff after the administrative maximum is right-censored above that depth; continued original-address activity at the horizon is source-survival censored. The depth is prefix-minimal for this ordered policy, not a graph-theoretic minimum over arbitrary intervention sets."
    },
    {
      "id": "DEF-LATENT-COUNTERFACTUAL-STRUCTURE",
      "term": "Latent counterfactual structure",
      "symbol": "",
      "kind": "working theoretical construct",
      "status": "provisional",
      "definition": "The marked relational structure of lawful successor events still realizable from a declared complete state under the declared law, including their conditional order, compatibility, and closure. It is not the single factual trajectory, a scalar field, or a claim that every successor is simultaneously available."
    },
    {
      "id": "DEF-ROOTED-GRAPH-ROLE",
      "term": "Frozen rooted graph-role signature",
      "symbol": "",
      "kind": "operational representation",
      "status": "provisional and representation-specific",
      "definition": "For Finding 075, the tuple of face6 and face18 active-neighbor counts, face6 and cube26 neighbor-component counts, and the sorted induced cube26-degree sequence among a target's active cube26 neighbors, conditioned on exact cube26 shell-one and Chebyshev shell-two occupancy. Equality of this signature is a declared matching representation, not graph isomorphism or an established sufficient statistic for successor dynamics."
    },
    {
      "id": "DEF-COHERENCE-TRANSITION-GEOMETRY",
      "term": "Coherence-conditioned transition geometry",
      "symbol": "",
      "kind": "working theoretical construct",
      "status": "provisional; not an established field or physical law",
      "definition": "The organized, potentially anisotropic and history-dependent structure of lawful next transitions conditioned on a focal coherence, its marked relational neighborhood, and its recent causal history. The term does not presuppose a scalar, vector, tensor, Euclidean field, force, gravity analogue, or independently confirmed predictive representation."
    },
    {
      "id": "DEF-SUCCESSOR-OPENNESS",
      "term": "Successor openness",
      "symbol": "O_{\\mathrm{succ}}",
      "kind": "developmental causal instrument",
      "status": "operational for Finding 078 only",
      "definition": "For a declared pre-step state and radius-two basin, the sum of frozen transfer probabilities over tick-start-eligible inactive-target activation edges in the marked hard-transfer candidate graph, accompanied by the number of distinct activation targets. It is not an entropy, an exhaustive multi-tick reachable set, or an independently confirmed predictor."
    },
    {
      "id": "DEF-REPAIR-AFFORDANCE",
      "term": "Repair affordance",
      "symbol": "A_{\\mathrm{repair}}",
      "kind": "developmental causal instrument",
      "status": "operational for Finding 078 only; predictive role untested",
      "definition": "For a declared pre-step state and radius-two basin, the sum of frozen transfer probabilities over eligible depleted-target secondary edges classified as component_bridge_cube26 or local_bridge_face6, accompanied by distinct target and source counts. It measures one-step bridge/reclosure accessibility under the declared representation, not realized repair or a universal counterfactual quantity."
    },
    {
      "id": "DEF-FACTORIAL-INTERACTION",
      "term": "Factorial interaction",
      "symbol": "I_{T\\times M}",
      "kind": "operational contrast",
      "status": "operational",
      "definition": "For natural, topology-only, marks-only, and joint states, the declared instrument contrast joint minus topology-only minus marks-only plus natural. A nonzero value establishes non-additivity of the instrument under those interventions; by itself it does not establish a downstream causal or predictive effect."
    }
  ]
}
