# Iota Rig configuration
# Octal-first default: A,R,P are 0..7. V is 0..(vector_count-1).
simulation_version: iota-rig-v0.1.0

experiment:
  objective: One-iota range sweep endpoint

lab:
  database: data/iota_lab.db
  experiments_dir: experiments

artifacts:
  keep_initial: true
  keep_final: true
  keep_every_n_snapshots: 4
  delete_unregistered: false

grid:
  size: 64              # 64 supports 64^3. Try 128 or 256 later.
  wrap: true            # toroidal boundary; avoids edge artifacts

init:
  seed: 42
  active_iotas: 1
  total_iotas: auto
  initial_density: auto
  mode: random          # random | center
  amplitude_range: [1, 7]
  range_range: [7, 7]
  payload_range: [0, 7]

vectors:
  mode: cube26          # cube6 | cube26 | random64
  vector_count: 64      # V encoded in two octal digits: 00..77 = 64 states
  behavior_bands:
    move: [0, 25]
    reflect: [26, 51]
    diffuse: [52, 63]

constants:
  # Tunable interaction constants. Start octal-like fractions.
  amplitude_coupling: 1.0
  range_coupling: 0.125         # 1/8
  payload_takeover: 0.5         # threshold for target payload replacement
  mutation_rate: 0.0            # chance to perturb payload after exchange
  decay_mode: inverse_square    # none | inverse | inverse_square | exponential
  conservation: soft            # soft | overwrite

run:
  ticks: 32
  snapshot_every: 16
  output_dir: output

visualization:
  max_points: 20000
  slice_axis: z
  slice_index: 32
