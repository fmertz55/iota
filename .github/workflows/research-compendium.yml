name: Research compendium

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: research-compendium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Provenance validators compare frozen files with historical commits
          # and verify the annotated tags that identify those commits.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Regenerate and validate evidence
        run: make verify

      - name: Reject stale generated evidence
        run: git diff --exit-code -- docs/definitions.md evidence/manifests paper/generated

      - name: Install minimal TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-recommended

      - name: Build paper
        run: make paper

      - name: Upload paper PDF
        uses: actions/upload-artifact@v7
        with:
          name: iota-working-paper
          path: build/paper/main.pdf
          if-no-files-found: error
